services:
  qr:
    build: .
    container_name: qr-processor
    restart: always
    volumes:
      - ./image:/app/image
      - ./qr_output:/app/qr_output
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
    networks:
      - qr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  nginx:
    image: nginx:alpine
    container_name: qr-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - qr
    networks:
      - qr-network

networks:
  qr-network:
    driver: bridge

volumes:
  qr_data:
    driver: local